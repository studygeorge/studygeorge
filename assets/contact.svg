<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" fill="none">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#a855f7;#22d3ee" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#22d3ee;#a855f7" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
<path d="M34 0H0V34" stroke="#ffffff" stroke-opacity="0.04" fill="none"/>
</pattern>
<radialGradient id="gA"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="gB"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="1" y="1" width="1278" height="148" rx="16"/></clipPath>
</defs>
<rect x="1" y="1" width="1278" height="148" rx="16" fill="#0b0f16" stroke="#1e2733"/>
<g clip-path="url(#clip)">
<rect x="1" y="1" width="1278" height="148" fill="url(#grid)"/>

<circle cx="1150" cy="-10" r="260" fill="url(#gA)" opacity="0.12"/>
<text x="48" y="64" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="650" font-size="26" fill="#e6edf3">Got an interesting engineering problem?</text>
<text x="48" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b96a5">Open to product collaborations, manufacturing and instrumentation projects.</text>
<rect x="922" y="52" width="310" height="46" rx="23" fill="#111826" stroke="url(#acc)" stroke-width="1.5"/>
<text x="1077" y="81" font-family="Cascadia Code, Consolas, 'JetBrains Mono', monospace" font-size="15.5" fill="#e6edf3" text-anchor="middle">workgeorg@yandex.ru</text>

</g>
</svg>